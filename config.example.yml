# 复制为 config.yml 后填写真实连接信息（config.yml 已 gitignore，勿提交密钥）
#
# 统一使用业务库 auth_admin（与 Release 种子 / 本机 dev 栈一致），不要再建 auth_admin_test。
# Redis 与 IDE `dev` 一致：db=0。端口：auth 20001，system 20002；网关 8080。
#
# 审计列：created_at / updated_at / created_by / updated_by
# 管理账号：Release 种子 Administrator / Admin@123456（全员同密）

urls:
    # 管理端 API（IDE 本地直连 system；Docker 可改为 http://localhost:8080）
    system: http://localhost:20002
    # auth 服务（内部 effective-codes）
    auth: http://localhost:20001
    # 网关（dept-scope 探针：登录 + /api/example/me）
    gateway: http://127.0.0.1:8080

mysql:
  host: 192.168.3.4
  port: 3306
  database: auth_admin
  user: root
  password: CHANGE_ME
  charset: utf8mb4

redis:
  host: 192.168.3.4
  port: 6379
  db: 0
  password: ""

admin:
  username: Administrator
  password: Admin@123456

internal_jwt:
  # 与 Nacos auth.common.jwt 一致（HS256）
  algorithm: HS256
  issuer: auth-service
  secret: CHANGE_ME_AT_LEAST_32_BYTES
  service_id: auth-harness

test_ids:
  id_min: 9001000001
  id_max: 9001002000
  dept_fanout: 9000100001
  dept_edge: 9000100002
  u_anchor: 9001000001
  u_shared: 9001002005
  role_user_base: 9000200001
  role_dept_mgr: 9000200002
  role_post_op: 9000200003
  role_shared: 9000200004

wait:
  outbox_poll_interval_sec: 0.5
  outbox_timeout_sec: 60
  reconcile_retry_sec: 2
  reconcile_max_attempts: 15
