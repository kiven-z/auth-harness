name: user-post-remove
description: 用户离开岗位后失去岗位授权角色
setup:
  - ensure_user_post:
      user_id: 9001002003
      post_id: 9000600001
      is_primary: true
      wait_outbox: true
steps:
  - delete_user_post:
      user_id: 9001002003
      post_id: 9000600001
  - wait_outbox:
      source_biz_id_contains: "delete-post:"
      timeout_sec: 60
  - assert:
      users:
        - user_id: 9001002003
          roles_not_contain: [R_POST_OP]
          permissions_not_contain: [harness:post:operate]
