name: user-post-assign
description: 用户加入岗位后继承岗位授权角色
setup:
  - delete_user_post:
      user_id: 9001002002
      post_id: 9000600001
      wait_outbox: true
steps:
  - post_user_post:
      user_id: 9001002002
      post_id: 9000600001
      is_primary: true
  - wait_outbox:
      source_biz_id_contains: "create-post:"
      timeout_sec: 60
  - assert:
      users:
        - user_id: 9001002002
          roles_contain: [R_POST_OP]
          permissions_contain: [harness:post:operate]
