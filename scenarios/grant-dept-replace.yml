name: grant-dept-replace
description: 部门角色 R_USER_BASE 替换为 R_DEPT_MGR，验证扇出成员刷新
setup:
  - put_dept_roles:
      dept_id: 9000100001
      role_ids: [9000200001, 9000200002]
  - wait_outbox:
      source_biz_id_contains: "replace-roles:"

      timeout_sec: 60
steps:
  - put_dept_roles:
      dept_id: 9000100001
      role_ids: [9000200002]
  - wait_outbox:
      source_biz_id_contains: "replace-roles:"

      timeout_sec: 60
  - assert:
      impacted_user_count_min: 2000
      users:
        - user_id: 9001000001
          roles_contain: [R_DEPT_MGR]
          roles_not_contain: [R_USER_BASE]
          permissions_contain: [harness:dept:manage]
          permissions_not_contain: [harness:user:read]
      sample_from_dept:
        dept_id: 9000100001
        sample_size: 5
        roles_contain: [R_DEPT_MGR]
        roles_not_contain: [R_USER_BASE]
