name: user-status-change
description: 用户状态变更触发单用户失效（结束时恢复）
steps:
  - batch_update_user_status:
      user_ids: [9001002098]
      status: 0
  - wait_outbox:
      source_biz_id_contains: "update:9001002098"
      timeout_sec: 60
  - assert:
      event:
        impacted_user_count_min: 1
  - batch_update_user_status:
      user_ids: [9001002098]
      status: 1
  - wait_outbox:
      source_biz_id_contains: "update:9001002098"
      timeout_sec: 60
