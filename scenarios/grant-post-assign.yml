name: grant-post-assign
description: 岗位追加 R_DEPT_MGR，验证岗位成员权限刷新
setup:
  - ensure_user_post:
      user_id: 9001002003
      post_id: 9000600001
      is_primary: true
      status: 1
      wait_outbox: true
      outbox_source_contains: "create-post:9001002003"
steps:
  - prepare_outbox_wait:
      source_biz_id_contains: "replace-roles:"

  - put_post_roles:
      post_id: 9000600001
      role_ids: [9000200002, 9000200003]
  - wait_outbox:
      source_biz_id_contains: "replace-roles:"

      timeout_sec: 60
  - verify_subject_roles:
      subject_type: POST
      subject_id: 9000600001
      role_codes: [R_DEPT_MGR, R_POST_OP]
  - assert:
      users:
        - user_id: 9001002003
          roles_contain: [R_DEPT_MGR, R_POST_OP]
          permissions_contain: [harness:dept:manage, harness:post:operate]
