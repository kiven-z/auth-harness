# 权限码中文名映射（扫代码后拼名：{resource}-{action}）
# 新增资源/动作时补这里；怪名字用 overrides。

# 扫描时排除的路径（相对 auth-server-pro 根）
exclude_globs:
  - "**/src/test/**"
  - "**/service-example/**"

# 忽略的演示/占位码（即使扫到也不入库）
ignore_codes:
  - sys:xxx
  - sys:user:add

# --prune 时不删（harness 测试权限等）
prune_protect_prefixes:
  - "harness:"

resources:
  log:authaudit: 权限审计日志
  log:login: 登录日志
  log:operation: 操作日志
  log:passwordhistory: 密码历史
  message:category: 站内信分类
  message:delivery: 消息投递
  message:inapp: 站内信发送
  message:template: 消息模板
  ops:invalidationevent: 授权失效事件
  ops:invalidationoutbox: 授权失效发件箱
  schedule:job: 定时任务
  schedule:jobgroup: 任务分组
  schedule:joblog: 任务日志
  sys:dept: 部门
  sys:file: 文件
  sys:file:exporttask: 文件导出任务
  sys:file:recycle: 文件回收站
  sys:menu: 菜单
  sys:permission: 权限
  sys:post: 岗位
  sys:role: 角色
  sys:user: 用户
  sys:userdept: 用户部门
  sys:userpost: 用户岗位
  sys:userrole: 用户角色

actions:
  cancel: 取消
  create: 新增
  delete: 删除
  detail: 详情
  diagnose: 诊断
  download: 下载
  export: 导出
  import: 导入
  privacy: 隐私设置
  purge: 彻底删除
  query: 查询
  recall: 撤回
  releaseclaim: 释放认领
  restore: 恢复
  retry: 重试
  send: 发送
  update: 修改

# 拼不出来时写死
overrides: {}
